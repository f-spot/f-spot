name: CI

on:
  push:
    branches: [main, modernize]
  pull_request:
    branches: [main, modernize]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # F-Spot.Tests.slnf: Hyena, FSpot, and Gtk unit tests only.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      # The FSpot.Cms tests drive a real liblcms2. Inconclusive is silent, so the two
      # runners that install it also set FSPOT_REQUIRE_LCMS2, which turns a missing
      # library into a failure instead of a quiet skip that still reports success.
      - name: Install Little-CMS (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends liblcms2-2
          echo "FSPOT_REQUIRE_LCMS2=1" >> "$GITHUB_ENV"

      - name: Install Little-CMS (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install little-cms2
          echo "FSPOT_REQUIRE_LCMS2=1" >> "$GITHUB_ENV"

      - name: Restore tests
        run: dotnet restore F-Spot.Tests.slnf

      - name: Test Hyena
        run: >
          dotnet test tests/Hyena.Tests/Hyena.Tests.csproj
          --configuration Release --no-restore
          --logger trx --results-directory TestResults

      - name: Test FSpot
        if: ${{ !cancelled() }}
        run: >
          dotnet test tests/FSpot.Tests/FSpot.Tests.csproj
          --configuration Release --no-restore
          --filter "TestCategory!=RequiresGdk&TestCategory!=RequiresGtk"
          --logger trx --results-directory TestResults

      - name: Test FSpot.Gtk
        if: ${{ !cancelled() }}
        run: >
          dotnet test tests/FSpot.Gtk.Tests/FSpot.Gtk.Tests.csproj
          --configuration Release --no-restore
          --filter "TestCategory!=RequiresGdk&TestCategory!=RequiresGtk"
          --logger trx --results-directory TestResults

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/**/*.trx
          if-no-files-found: ignore

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Restore
        run: dotnet restore F-Spot.slnx

      - name: Build
        run: dotnet build F-Spot.slnx --configuration Release --no-restore
