name: CI

on:
  push:
    branches: [main, modernize]
  pull_request:
    branches: [main, modernize]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  AVALONIA_TELEMETRY_OPTOUT: 1

jobs:
  # F-Spot.Tests.slnf: Core, Avalonia, and icon rasterizer tests.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      # The FSpot.Cms tests drive a real liblcms2. Inconclusive is silent, so the two
      # runners that install it also set FSPOT_REQUIRE_LCMS2, which turns a missing
      # library into a failure instead of a quiet skip that still reports success.
      - name: Install Little-CMS (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends liblcms2-2
          echo "FSPOT_REQUIRE_LCMS2=1" >> "$GITHUB_ENV"

      - name: Install Little-CMS (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install little-cms2
          echo "FSPOT_REQUIRE_LCMS2=1" >> "$GITHUB_ENV"

      # Windows has no distro package. Build the shared library the resolver already
      # loads through FSPOT_LCMS2_LIBRARY, and require it so a missing DLL fails the job.
      - name: Install Little-CMS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $src = Join-Path $env:RUNNER_TEMP "Little-CMS"
          git clone --depth 1 --branch lcms2.19.1 https://github.com/mm2/Little-CMS.git $src
          if ($LASTEXITCODE -ne 0) { throw "git clone of Little-CMS failed" }
          $build = Join-Path $src "build"
          cmake -S $src -B $build -DLCMS2_BUILD_SHARED=ON -DLCMS2_BUILD_STATIC=OFF -DLCMS2_BUILD_TOOLS=OFF -DLCMS2_BUILD_TESTS=OFF -DLCMS2_WITH_JPEG=OFF -DLCMS2_WITH_TIFF=OFF
          if ($LASTEXITCODE -ne 0) { throw "cmake configure of Little-CMS failed" }
          cmake --build $build --config Release
          if ($LASTEXITCODE -ne 0) { throw "cmake build of Little-CMS failed" }
          $dll = Get-ChildItem -Path $build -Recurse -Filter "lcms2.dll" | Select-Object -First 1
          if (-not $dll) { throw "lcms2.dll was not produced" }
          Add-Content -Path $env:GITHUB_PATH -Value $dll.DirectoryName
          Add-Content -Path $env:GITHUB_ENV -Value "FSPOT_LCMS2_LIBRARY=$($dll.FullName)"
          Add-Content -Path $env:GITHUB_ENV -Value "FSPOT_REQUIRE_LCMS2=1"

      - name: Restore tests
        run: dotnet restore F-Spot.Tests.slnf

      - name: Test FSpot
        if: ${{ !cancelled() }}
        run: >
          dotnet test tests/FSpot.Tests/FSpot.Tests.csproj
          --configuration Release --no-restore
          --logger trx --results-directory TestResults

      - name: Test FSpot.Avalonia
        if: ${{ !cancelled() }}
        run: >
          dotnet test tests/FSpot.Avalonia.Tests/FSpot.Avalonia.Tests.csproj
          --configuration Release --no-restore
          --logger trx --results-directory TestResults

      - name: Test RasterizeIcons
        if: ${{ !cancelled() }}
        run: >
          dotnet test tests/RasterizeIcons.Tests/RasterizeIcons.Tests.csproj
          --configuration Release --no-restore
          --logger trx --results-directory TestResults

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/**/*.trx
          if-no-files-found: ignore

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Restore
        run: dotnet restore F-Spot.slnx

      - name: Build
        run: dotnet build F-Spot.slnx --configuration Release --no-restore
