name: Deploy F-Spot Documentation

on:
  push:
    branches: [main]
    paths: ['CC_Docs/**']
  pull_request:
    branches: [main]
    paths: ['CC_Docs/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      pages: write
      id-token: write
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'CC_Docs/docs-site/package-lock.json'
      
      - name: Install dependencies
        run: |
          cd CC_Docs/docs-site
          npm ci
      
      - name: Build documentation
        run: |
          cd CC_Docs/docs-site
          npm run build
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'CC_Docs/docs-site/docs/.vitepress/dist'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4